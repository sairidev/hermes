name: Docker

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Image name (lowercase)
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (Docker biasa + simulasi Pterodactyl)
        env:
          IMAGE: ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          wait_ready() {  # $1 = port, $2 = container
            local ok=0
            for _ in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:$1/_status" 2>/dev/null | jq -e '.services.hermes == "running"' >/dev/null; then ok=1; break; fi
              sleep 3
            done
            echo "::group::Log $2"; docker logs "$2" 2>&1 | tail -60; echo "::endgroup::"
            if [ "$ok" != 1 ]; then echo "::error::[$2] Hermes tidak jalan dalam 3 menit"; return 1; fi
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$1/")
            if [ "$code" != 302 ]; then echo "::error::[$2] dashboard harus redirect ke login (302), dapat $code"; return 1; fi
            echo "[$2] Hermes hidup dan dashboard terkunci login ✓"
          }

          # 1) Docker biasa: docker run -d → entrypoint mode headless
          docker run -d --name docker-mode -p 3000:3000 -e ADMIN_PASSWORD=ci-test-password "$IMAGE"
          wait_ready 3000 docker-mode

          # 2) Seperti Wings/Pterodactyl: UID lain, /home/container kosong ter-mount, STARTUP dari egg
          mkdir -p /tmp/ptero && sudo chown 988:988 /tmp/ptero
          docker run -d --name ptero-mode --user 988:988 -v /tmp/ptero:/home/container \
            -e STARTUP=hermes-web -e SERVER_PORT=3100 -e START_PROMPT_TIMEOUT=2 \
            -e P_SERVER_UUID=ci-test -p 3100:3100 "$IMAGE"
          wait_ready 3100 ptero-mode
          docker logs ptero-mode 2>&1 | grep -q "Hermes siap dipakai" \
            || { echo "::error::baris 'Hermes siap dipakai' (deteksi Running di egg) tidak muncul"; exit 1; }
          sudo test -f /tmp/ptero/data/secrets.json \
            || { echo "::error::data tidak tersimpan di /home/container/data"; exit 1; }

      - name: Summary
        if: success()
        run: |
          {
            echo "### Image siap ✓"
            echo ""
            echo "Pterodactyl: import \`docker/egg-hermes.json\`, image \`${{ steps.img.outputs.name }}:latest\`"
            echo ""
            echo '```bash'
            echo "docker pull ${{ steps.img.outputs.name }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
